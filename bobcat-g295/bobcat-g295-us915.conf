# Bobcat Miner 300 (G290/G295, RK3566) onboard SX1302 + SX1250, US915.
#
# Board profile for shvelo/sx1302_rns. Single-channel raw LoRa for Reticulum,
# not a LoRaWAN channel plan.
#
# Hardware facts below were read from rk3566-bobcat.dtb in the community
# BobcatArmbian29x.img (Bobcat-Armbian release 1.0). They have NOT yet been
# confirmed on a running unit. Items marked UNVERIFIED need a check first.
#
#   SPI      /dev/spidev5.0   bit-banged spi-gpio bus 5, 2 MHz max, in the stock
#                             DTB (status = okay). No overlay needed.
#   Reset    gpio4 line 21    DTB pinctrl label "lora-rst" (GPIO4_C5, global 149).
#   3V3      GPIO3_25         "lora_3v3" regulator, always-on; leave it alone.
#   PA en    (not in DTB)     Meshpoint docs say global GPIO 147 (= gpio4 line
#                             19). UNVERIFIED and NOT driven by this profile.

[board]
spi_path = /dev/spidev5.0
radio_type = SX1250
clksrc = 0
full_duplex = no
single_input_mode = no

# UNVERIFIED: RSSI calibration copied from the RAK2287 example. The Bobcat's
# front end may differ, so absolute RSSI values will be approximate.
rssi_offset = -215.4
rssi_tcomp_a = 0.0
rssi_tcomp_b = 0.0
rssi_tcomp_c = 20.41
rssi_tcomp_d = 2162.56
rssi_tcomp_e = 0.0

# Relative paths resolve against this file's directory.
reset_script = ./reset_bobcat_g295.sh
# Line OFFSET within gpio4 (not the global number 149). The script finds the
# gpiochip whose label is gpio4 (0xfe770000) itself.
reset_gpio = 21
reset_start_args = start
reset_stop_args = stop
reset_enabled = yes

[rf]
chain = 0
# PLACEHOLDER: set to the frequency your RNodes use.
frequency = 915000000
tx_enable = yes
tx_power = 14

[channel]
# service = LoRa service channel (IF chain 8), 125/250/500 kHz, one SF.
# This is the mode that can match an RNode's single-channel radio.
mode = service
if_frequency = 0
bandwidth = 125000
# PLACEHOLDER: must match the RNodes (Reticulum's example config uses SF8/CR5).
spreadingfactor = 8
codingrate = 5
# RNode firmware's minimum preamble is 18 symbols (LORA_PREAMBLE_SYMBOLS_MIN).
preamble = 18

# TX gain table. UNVERIFIED: copied from the RAK2287 example, and the Bobcat's
# PA/front end may differ. Capped at 16 dBm on purpose: the HAL cannot request
# more than the last entry, so this is a safety limit until output power has
# been measured on a real unit. NEVER transmit without an antenna attached.
[txgain.12]
rf_power = 12
pa_gain = 1
pwr_idx = 4

[txgain.13]
rf_power = 13
pa_gain = 1
pwr_idx = 5

[txgain.14]
rf_power = 14
pa_gain = 1
pwr_idx = 6

[txgain.15]
rf_power = 15
pa_gain = 1
pwr_idx = 7

[txgain.16]
rf_power = 16
pa_gain = 1
pwr_idx = 8
