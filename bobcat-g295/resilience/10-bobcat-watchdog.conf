# Arm the SoC's hardware watchdog from systemd: if systemd (or the whole system)
# stops answering for about this long, the board resets itself instead of
# staying dead until someone power-cycles it.
# The hardware cannot be disarmed once started; removing this file takes full
# effect at the next reboot.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
