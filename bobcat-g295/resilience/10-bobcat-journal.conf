# Keep the journal on the eMMC (/var/log/journal is a link there) so what led up
# to a crash or power loss is still readable after the reboot, within firm limits.
# @KEEP_DAYS@ is filled in by the installer from LOG_KEEP_DAYS.
[Journal]
Storage=persistent
SystemMaxUse=20M
SystemMaxFileSize=2M
SystemKeepFree=1G
MaxFileSec=1day
MaxRetentionSec=@KEEP_DAYS@day
