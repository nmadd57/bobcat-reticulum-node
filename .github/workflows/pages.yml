name: Config generator (GitHub Pages)

# Publishes the static config generator in site/ to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["site/**", "tools/usb-flash/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Build images"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies for the installer's validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-yaml u-boot-tools dosfstools mtools
      - name: Test the generator against the installer
        run: node test/test-site-config.js
      - name: Test in-browser password hashing
        run: node test/test-sha512crypt.js
      - name: Test the USB flasher modules
        run: |
          for t in pure protocol fat e2e; do node test/test-flash-$t.mjs; done
          node test/test-maskrom.mjs
      - name: Build the fastboot boot partition for the USB flasher
        run: |
          tools/usb-flash/build-flashmode.sh --mode fastboot --out /tmp/flashmode
          mkdir -p site/flash/flashmode
          cp /tmp/flashmode/fat.img site/flash/flashmode/fat.img
      - name: Publish the latest release image next to the page
        # GitHub's release downloads send no CORS headers, so a page cannot read them. Pages does, so the
        # USB flasher fetches the image from here. Skipped when there is no release yet.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
          if [ -z "$tag" ]; then echo "no release yet"; exit 0; fi
          mkdir -p site/flash/image
          if gh release download "$tag" --pattern 'bobcat-g295-emmc.img.xz' --dir site/flash/image; then
            size=$(stat -c %s site/flash/image/bobcat-g295-emmc.img.xz)
            printf '{"tag":"%s","name":"bobcat-g295-emmc.img.xz","size":%s}\n' "$tag" "$size" > site/flash/image/info.json
            ls -l site/flash/image
          else
            echo "release $tag has no eMMC image; skipping"; rm -rf site/flash/image
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Let the artifact index settle
        run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v4
