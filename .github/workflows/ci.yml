name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S warning \
            installer/install-template.sh installer/build-installer.sh \
            image/build-image.sh image/firstboot/bobcat-firstboot \
            image/firstboot/test-firstboot.sh \
            bobcat-g295/reset_bobcat_g295.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc make patch
          python -m pip install --upgrade pip
          python -m pip install "rns>=1.5.7,<2" pytest
      - name: Python tests (interface, framing, worker, HAL ABI)
        working-directory: sx1302_rns
        run: python -m pytest -q
      - name: First-boot script tests
        run: image/firstboot/test-firstboot.sh

  installer:
    name: Build installer bundle
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: installer/build-installer.sh
      - name: Check the bundle
        run: |
          bash dist/bobcat-g295-install.sh --help | head -5
          d="$(mktemp -d)"
          bash dist/bobcat-g295-install.sh --extract-only "$d"
          test -f "$d/sx1302_rns/vendor/sx1302_hal/libloragw/Makefile"
          test -x "$d/bobcat-g295/reset_bobcat_g295.sh"
      - name: Build the HAL from the bundle
        run: |
          d="$(mktemp -d)"
          bash dist/bobcat-g295-install.sh --extract-only "$d"
          cd "$d/sx1302_rns" && ./scripts/build_hal.sh
          test -f build/libloragw.so
      - uses: actions/upload-artifact@v4
        with:
          name: bobcat-g295-install
          path: dist/bobcat-g295-install.sh
          if-no-files-found: error
