name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S warning \
            installer/install-template.sh installer/build-installer.sh installer/test-installer.sh \
            image/lib.sh image/build-image.sh image/build-flasher.sh image/verify-flasher.sh \
            image/firstboot/bobcat-firstboot image/firstboot/test-firstboot.sh \
            image/flasher/init.sh image/flasher/test-init.sh \
            bobcat-g295/reset_bobcat_g295.sh \
            bobcat-g295/resilience/bobcat-netwatch bobcat-g295/resilience/test-netwatch.sh \
            bobcat-g295/resilience/bobcat-logprune bobcat-g295/resilience/test-logprune.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc make patch dash
          python -m pip install --upgrade pip
          python -m pip install "rns>=1.5.7,<2" pytest pyyaml
      - name: Python tests (interface, framing, worker, HAL ABI)
        working-directory: sx1302_rns
        run: python -m pytest -q
      - name: Partition tool and settings generator tests
        run: python -m pytest -q image/tools tools
      - name: Installer settings tests (dry run, config parsing, saved settings)
        run: installer/test-installer.sh
      - name: First-boot script tests
        run: image/firstboot/test-firstboot.sh
      - name: Flasher init script tests (bash and dash)
        run: image/flasher/test-init.sh
      - name: Self-recovery tests (network watchdog, log pruning)
        run: |
          bobcat-g295/resilience/test-netwatch.sh
          bobcat-g295/resilience/test-logprune.sh

  installer:
    name: Build installer bundle
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: installer/build-installer.sh
      - name: Check the bundle
        run: |
          bash dist/bobcat-g295-install.sh --help | head -5
          d="$(mktemp -d)"
          bash dist/bobcat-g295-install.sh --extract-only "$d"
          test -f "$d/sx1302_rns/vendor/sx1302_hal/libloragw/Makefile"
          test -x "$d/bobcat-g295/reset_bobcat_g295.sh"
      - name: The built bundle validates a settings file (dry run)
        run: |
          python3 -m pip install pyyaml
          printf 'WIFI_SSID=Test\nWIFI_PASS=password123\nFREQUENCY=915000000\n' > /tmp/t.conf
          bash dist/bobcat-g295-install.sh --dry-run --config /tmp/t.conf | tee /tmp/plan.txt
          grep -q "wifi:          Test" /tmp/plan.txt
      - name: Build the HAL from the bundle
        run: |
          d="$(mktemp -d)"
          bash dist/bobcat-g295-install.sh --extract-only "$d"
          cd "$d/sx1302_rns" && ./scripts/build_hal.sh
          test -f build/libloragw.so
      - uses: actions/upload-artifact@v4
        with:
          name: bobcat-g295-install
          path: dist/bobcat-g295-install.sh
          if-no-files-found: error
