name: Build images

# Builds the self-installing images from the community base images.
#   flasher: SD card image that flashes the eMMC and copies your settings file
#            across (recommended for G290/G295)
#   sd:      standalone image that boots from the SD card
#
# Run manually (Actions tab -> Build images -> Run workflow), push a version
# tag (v1.0.0) to build both and attach them to a release, or let the weekly
# schedule rebuild both (flasher kept as an artifact for 14 days) so a change in
# the base image, an action or a package shows up as a failed run, not at release.
#
# The base images are third-party builds; keep this repository private unless
# their license allows redistribution.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which image to build"
        type: choice
        options: [flasher, sd, both]
        default: flasher
      upload_artifact:
        description: "Upload the images as workflow artifacts (they count against Actions storage)"
        type: boolean
        default: true
      xz_level:
        description: "xz compression preset (1 fast .. 9 small)"
        default: "6"
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC

permissions:
  contents: write   # attach files to a release on tags

env:
  XZ_LEVEL: ${{ github.event.inputs.xz_level || '6' }}

jobs:
  flasher:
    name: eMMC flasher image
    if: github.event_name == 'push' || github.event.inputs.variant != 'sd'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs xz-utils curl python3 python3-yaml dosfstools mtools gdisk

      - name: Cache the base flasher
        uses: actions/cache@v6
        with:
          path: .cache/Bobcat29X_EMMC_Flasher.img.xz
          key: base-flasher-f797aaff9406

      - name: Build
        env:
          BUILD_REF: ${{ github.sha }}
        run: image/build-flasher.sh --emmc-out dist/bobcat-g295-emmc.img.xz

      - name: Verify (partition tables, FAT, mounts, settings writer)
        run: sudo image/verify-flasher.sh dist/bobcat-g295-flasher.img.xz

      - name: Summary
        run: |
          {
            echo "### eMMC flasher image"
            echo
            echo '```'
            cat dist/bobcat-g295-flasher.img.xz.sha256
            ls -lh dist/bobcat-g295-flasher.img.xz | awk '{print $5, $9}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.upload_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bobcat-g295-flasher
          path: |
            dist/bobcat-g295-flasher.img.xz
            dist/bobcat-g295-flasher.img.xz.sha256
            dist/bobcat-g295-emmc.img.xz
            dist/bobcat-g295-emmc.img.xz.sha256
          compression-level: 0
          retention-days: ${{ github.event_name == 'push' && 1 || 14 }}
          if-no-files-found: error

  sd-image:
    name: Standalone SD image
    if: github.event_name == 'push' || github.event.inputs.variant != 'flasher'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs xz-utils curl python3

      - name: Cache the base image
        uses: actions/cache@v6
        with:
          path: .cache/BobcatArmbian29x.img.xz
          key: base-image-079b540477c3

      - name: Build
        env:
          BUILD_REF: ${{ github.sha }}
        run: image/build-image.sh

      - name: Summary
        run: |
          {
            echo "### Standalone SD image"
            echo
            echo '```'
            cat dist/bobcat-g295-reticulum.img.xz.sha256
            ls -lh dist/bobcat-g295-reticulum.img.xz | awk '{print $5, $9}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: github.event_name == 'push' || github.event.inputs.upload_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bobcat-g295-sd-image
          path: |
            dist/bobcat-g295-reticulum.img.xz
            dist/bobcat-g295-reticulum.img.xz.sha256
            dist/bobcat-g295-install.sh
          compression-level: 0
          retention-days: ${{ github.event_name == 'push' && 1 || 14 }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [flasher, sd-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh assets
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Bobcat G290/G295 Reticulum node. Use the flasher image (bobcat-g295-flasher.img.xz) for a unit with its original software, with your settings on its BOBCFG partition; see the README. bobcat-g295-emmc.img.xz is the OS that flasher installs, as its own file: write it to the eMMC by other means (see docs/usb-flashing.md). The standalone SD image (bobcat-g295-reticulum.img.xz) boots ONLY from the SD card. Also: the stand-alone installer, and an example settings file. Verify downloads with the .sha256 files." \
            assets/bobcat-g295-flasher.img.xz assets/bobcat-g295-flasher.img.xz.sha256 \
            assets/bobcat-g295-emmc.img.xz assets/bobcat-g295-emmc.img.xz.sha256 \
            assets/bobcat-g295-reticulum.img.xz assets/bobcat-g295-reticulum.img.xz.sha256 \
            assets/bobcat-g295-install.sh \
            image/firstboot/bobcat-install.conf.example
