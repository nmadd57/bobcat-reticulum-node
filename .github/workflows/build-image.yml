name: Build image

# Builds the self-installing Bobcat image from the community base image.
#   - run manually (Actions tab -> Build image -> Run workflow), or
#   - push a version tag (v1.0.0) to also attach the image to a release.
#
# The base image is a third-party build; keep this repository private unless
# its license allows redistribution.

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload the image as a workflow artifact (counts against Actions storage)"
        type: boolean
        default: true
      xz_level:
        description: "xz compression preset for the output (1 fast .. 9 small)"
        default: "6"
  push:
    tags: ["v*"]

permissions:
  contents: write   # attach files to a release on tags

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs xz-utils curl python3

      - name: Cache the base image
        uses: actions/cache@v4
        with:
          path: .cache/BobcatArmbian29x.img.xz
          key: base-image-079b540477c3

      - name: Build
        env:
          BUILD_REF: ${{ github.sha }}
          XZ_LEVEL: ${{ github.event.inputs.xz_level || '6' }}
        run: image/build-image.sh

      - name: Summary
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            cat dist/bobcat-g295-reticulum.img.xz.sha256
            ls -lh dist/bobcat-g295-reticulum.img.xz | awk '{print $5, $9}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: github.event_name == 'push' || github.event.inputs.upload_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bobcat-g295-reticulum-image
          path: |
            dist/bobcat-g295-reticulum.img.xz
            dist/bobcat-g295-reticulum.img.xz.sha256
            dist/bobcat-g295-install.sh
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Self-installing Bobcat G290/G295 Reticulum node image and the stand-alone installer. Verify with the .sha256 file." \
            dist/bobcat-g295-reticulum.img.xz \
            dist/bobcat-g295-reticulum.img.xz.sha256 \
            dist/bobcat-g295-install.sh
